<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-BGR — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b0f1a;
            --card-bg: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.10);
            --primary: #3b82f6;
            --cyan: #22d3ee;
            --danger: #ef4444;
            --text: #f1f5f9;
            --muted: #64748b;
            --dim: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(at 15% 15%, rgba(59,130,246,.18) 0, transparent 55%),
                radial-gradient(at 85% 85%, rgba(139,92,246,.14) 0, transparent 55%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            padding: 44px 40px;
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .logo  { font-size: 44px; line-height: 1; margin-bottom: 12px; }
        .brand h1 { font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

        .err {
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.30);
            color: var(--danger);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        input {
            width: 100%;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border .2s;
            margin-bottom: 16px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.20); }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform .15s, box-shadow .15s;
        }
        .btn-login:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,.35); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        footer { text-align: center; font-size: 11px; color: var(--dim); margin-top: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="logo">⚡</div>
        <h1>E-BGR</h1>
        <p>Sistem Absensi Tamu Biometrik<br>PLN UPDL Bogor</p>
    </div>

    <div id="err" class="err"></div>

    <form id="form" onsubmit="doLogin(event)">
        <label for="u">Username</label>
        <input id="u" type="text" placeholder="Masukkan username..." autocomplete="username" required>

        <label for="p">Password</label>
        <input id="p" type="password" placeholder="Masukkan password..." autocomplete="current-password" required>

        <button class="btn-login" id="btn" type="submit">Masuk ke Dashboard</button>
    </form>

    <footer>E-BGR Face Recognition &copy; 2025 · PLN UPDL Bogor</footer>
</div>

<script>
    async function doLogin(e) {
        e.preventDefault();
        const btn  = document.getElementById('btn');
        const err  = document.getElementById('err');
        const u    = document.getElementById('u').value.trim();
        const p    = document.getElementById('p').value.trim();

        btn.disabled    = true;
        btn.textContent = '⏳ Memverifikasi...';
        err.style.display = 'none';

        try {
            const res  = await fetch('/api/login', {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body:    JSON.stringify({ username: u, password: p }),
                cache:   'no-store'
            });
            const data = await res.json();

            if (data.status === 'success') {
                // Ganti halaman sesuai role
                window.location.replace('/');
            } else {
                err.textContent   = '❌ ' + (data.message || 'Username atau password salah.');
                err.style.display = 'block';
            }
        } catch (_) {
            err.textContent   = '❌ Tidak dapat terhubung ke server. Pastikan server.py berjalan.';
            err.style.display = 'block';
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Masuk ke Dashboard';
        }
    }
</script>
</body>
</html>
